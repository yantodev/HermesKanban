[project]
name = "hermes-kanban-webui"
version = "0.1.0"
description = "Standalone Trello-like WebUI for Hermes Kanban"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "filelock>=3.13",
]

[project.urls]
Repository = "https://github.com/PriuS2/HermesKanban"

[project.optional-dependencies]
test = ["pytest", "httpx"]

[project.scripts]
hermes-kanban-webui = "kanban_webui.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kanban_webui"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "kanban_webui/static"

[tool.hatch.build.targets.sdist.force-include]
"static" = "static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
